name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x  

    - name: Restore dependencies
      run: dotnet restore RiidedStock.sln

    - name: Build
      run: dotnet build RiidedStock.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test RiidedStock.sln --configuration Release --no-build --verbosity normal
